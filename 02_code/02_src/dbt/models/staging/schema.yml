version: 2

# Tests for the staging layer. Nulls pass accepted_values by design: a missing value is a
# completeness question, handled by not_null only where a value is required.
# Every model is deduplicated within its source, so the grain tests below must hold
# no matter how many ingest_date snapshots have been loaded.

models:
  - name: stg_ashby_jobs
    description: "Ashby postings in Saudi Arabia, one row per posting. Latest snapshot wins; first_seen_at / last_seen_at span every snapshot."
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "first_seen_at <= last_seen_at"
    columns:
      - name: source_record_sk
        description: "Surrogate key: hash of source_name + source_job_id (plus city_raw in Workable). Unique across all six sources."
        data_tests:
          - unique
          - not_null
      - name: source_job_id
        data_tests:
          - unique
          - not_null
      - name: title_raw
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: ingested_at
        data_tests:
          - not_null
      - name: workplace_type_raw
        data_tests:
          - accepted_values:
              arguments:
                values: ['Remote', 'Hybrid', 'OnSite']
      - name: employment_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Full-time', 'Part-time', 'Contract', 'Internship', 'Temporary', 'Volunteer', 'Full-time and Part-time', 'Other']
      - name: ingest_date
        description: "Collection date, read from the ADLS landing path (ingest_date=YYYY-MM-DD)."
        data_tests:
          - not_null
      - name: is_active
        description: "True when the posting appears in the latest pull of the board it came from (for Greenhouse, of any board that listed it). A posting missing from its board's latest pull has been closed. A board that was not pulled again keeps its postings' last known state, so a partial pull never marks unchecked boards as closed."
        data_tests:
          - not_null
      - name: country_raw
        description: "Scope filter: Saudi Arabia only (null allowed when the structured field is missing and the location text matched)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Saudi Arabia']

